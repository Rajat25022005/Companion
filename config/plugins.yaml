gmail:
  enabled: true
  credentials_path: ~/.config/companion/google_credentials.json
  scopes:
    - https://www.googleapis.com/auth/gmail.modify

calendar:
  enabled: true
  credentials_path: ~/.config/companion/google_credentials.json
  scopes:
    - https://www.googleapis.com/auth/calendar

drive:
  enabled: true
  credentials_path: ~/.config/companion/google_credentials.json
  scopes:
    - https://www.googleapis.com/auth/drive

github:
  enabled: false
  token_env: GITHUB_TOKEN
